# Généré par l'installateur console Rackloom — aucune section interactive Subiquity.
# Sous le capot : Ubuntu Server 24.04 Subiquity/curtin (opérateur : pas d'UI Ubuntu).
version: 1
locale: fr_FR.UTF-8
keyboard:
  layout: fr
  variant: ""
timezone: Etc/UTC
refresh-installer:
  update: false
__RACKLOOM_NETWORK_BLOCK__
identity:
  realname: __RACKLOOM_REALNAME__
  username: __RACKLOOM_USERNAME__
  hostname: __RACKLOOM_HOSTNAME__
  password: __RACKLOOM_PASSWORD_HASH__
storage:
  layout:
    name: lvm
    match:
      path: __RACKLOOM_DISK_PATH__
ssh:
  install-server: true
  allow-pw: false
packages:
  - qemu-guest-agent
  - curl
  - ca-certificates
  - openssl
apt:
  preserve_sources_list: false
  fallback: offline-install
snaps: []
late-commands:
  - /cdrom/rackloom/install-debs.sh
  - curtin in-target -- mkdir -p /opt/rackloom /etc/rackloom /var/lib/rackloom
  - curtin in-target -- mkdir -p /etc/rackloom/secrets /etc/rackloom/keys /etc/rackloom/tls
  - cp -a /cdrom/rackloom/payload/. /target/
  - curtin in-target -- chmod 0755 /usr/local/sbin/rackloom-firstboot /usr/local/lib/rackloom/*.sh
  - curtin in-target -- chmod 0644 /lib/systemd/system/rackloom.service /lib/systemd/system/rackloom-firstboot.service
  - curtin in-target -- systemctl enable docker.service
  - curtin in-target -- systemctl enable rackloom-firstboot.service
  - curtin in-target -- systemctl enable rackloom.service
  - curtin in-target -- usermod -aG docker rackloom || true
  - curtin in-target -- bash -c "printf '%s\n' __RACKLOOM_HOSTNAME_RAW__ > /etc/rackloom/install-hostname"
shutdown: reboot
