# Lot 1 : lint, contrats d'imports, tests backend, typecheck web, dérive OpenAPI, puis bout en bout sur une
# pile jetable (make test-e2e). Aucun secret de dépôt : tout est généré sur l'exécuteur et détruit avec lui.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.10"
  NODE_VERSION: "22.23.4"
  TERRAFORM_VERSION: "1.17.2"

jobs:
  test:
    name: make test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16.11-bookworm
        env:
          # Base jetable de l'exécuteur, joignable seulement depuis le job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RACKLOOM_TEST_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Image des nœuds de labo (tests Ansible)
        run: docker build --quiet -t rackloom/lab-node:dev lab/images/lab-node
      - run: make venv
      - run: make test
      - name: mypy (non bloquant au lot 1, dette chiffrée dans docs/progress.md)
        run: make typecheck || echo "::warning title=mypy::erreurs de typage restantes (dette du lot 1, non bloquante)"

  e2e:
    name: make test-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Outils NSS (magasin de certificats du navigateur de test)
        run: sudo apt-get update -q && sudo apt-get install -y -q libnss3-tools
      - run: make venv
      - name: Chromium pour Playwright
        working-directory: web
        run: npx playwright install --with-deps chromium
      - run: make doctor
      - run: make test-e2e
      - name: Arrêt de la pile jetable
        if: always()
        run: >-
          docker compose -f compose/compose.yaml -f compose/compose.demo.yaml -f compose/compose.test.yaml
          --profile lab --profile tools down -v --remove-orphans
