schema: rackloom.template/v1
slug: ubuntu-web
version: 1.0.0
title: "Serveur web Ubuntu (Nginx)"
summary: "Machine Ubuntu 24.04 avec le serveur web Nginx installé, démarré et vérifié."
keywords: [ubuntu, nginx, web, "serveur web", site]
lifecycle:
  review: "template de démonstration du lot 1, revu avec le plan de lot"
  lab_test: "testé localement sur nœuds de labo ; non validé en laboratoire réel"

# Méthode de création : clonage d'une image vSphere existante. Une image vSphere n'est
# qu'un point de départ ; ce template décrit le résultat complet et vérifiable.
creation:
  method: vsphere_image
  image: {tags: [ubuntu-24.04], tie_break: [name_asc]}
  terraform: {module: lab-vm, version: 1.0.0}

system:
  os: {family: ubuntu, version: "24.04"}
  # Partitionnement : celui de l'image, non modifié par ce template.
  volumes: [{mount: /, source: image}]
  network: {tags: [web], tie_break: [free_ips_desc, name_asc]}
  security: {ssh_host_key: anchored, password_login: disabled}

components:
  - {name: nginx, version: 1.0.0, config: {mode: static_site, listen_port: 80}}

# Entrées fonctionnelles du parcours « Déployer » (seules valeurs fournies par le demandeur).
inputs:
  usages:
    test:
      label: "Test"
      environment_kinds: [lab, dev]
      lifetime_days: {default: 14, max: 30}
    production:
      label: "Production"
      environment_kinds: [prod]
      explicit_environment_required: true
  sizes:
    light: {label: "Test léger", cpu: 1, memory_mb: 1024, disk_gb: 16}
    standard: {label: "Standard", cpu: 2, memory_mb: 2048, disk_gb: 20}
    high: {label: "Charge élevée", cpu: 4, memory_mb: 4096, disk_gb: 40}
  default_size: standard
  quantity: {min: 1, max: 2, default: 1}

# Paramètres résolus par le serveur à partir de l'inventaire octroyé et des politiques.
resolution:
  cluster: {tie_break: [name_asc]}
  datastore: {min_free_gb: 50, tie_break: [free_gb_desc, name_asc]}
  naming: "{project}-{environment}-web-{index:02d}"

secrets: []

deployment_policy:
  approval: {required: true}
  waves: [{name: unique, hosts: all}]
  stop_on_failure: true
  retry: failed_hosts_and_steps_only

ansible:
  configure: {playbook: configure, version: 1.0.0}
  collect: {playbook: collect, version: 1.0.0}

preview_limits:
  - "Les VM n'existent pas encore : le check mode Ansible ne couvre aucune tâche de cette demande."
  - "Le plan Terraform porte sur des ressources de labo locales, pas sur vSphere."
simulated_steps: [vm_inventory, guest_customization, ip_assignment]
