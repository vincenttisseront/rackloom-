# Repli figé du runner. Le worker écrit aussi project/ansible.cfg (prioritaire, même contenu de sûreté).
# Aucune variable ansible_* ne vient d'un demandeur ; la vérification de clé d'hôte ne se désactive pas.
[defaults]
host_key_checking = True
retry_files_enabled = False
roles_path = roles
nocolor = True
