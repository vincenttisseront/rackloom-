# Pile de test de bout en bout (make test-e2e) : nœuds de labo supplémentaires, car chaque VM
# simulée occupe un nœud pour toute sa vie. Le parcours Playwright D1 à D6 en crée jusqu'à six,
# et AT01 en ajoute deux.
services:
  lab-node-4: &lab-node
    image: rackloom/lab-node:dev
    hostname: lab-node-4
    networks: [rn-lab]
    restart: unless-stopped
    volumes: ["lab-keys:/lab-keys:ro"]
    profiles: [lab]

  lab-node-5:
    <<: *lab-node
    hostname: lab-node-5

  lab-node-6:
    <<: *lab-node
    hostname: lab-node-6

  lab-node-7:
    <<: *lab-node
    hostname: lab-node-7

  lab-node-8:
    <<: *lab-node
    hostname: lab-node-8
