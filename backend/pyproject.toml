[project]
name = "rackloom"
version = "0.1.0"
description = "Plan de contrôle Rackloom : API et worker"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.165.0",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.9",
  "psycopg-pool==3.3.3",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "argon2-cffi==25.1.0",
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "PyYAML==6.0.4",
  "alembic==1.20.1",
  "SQLAlchemy==2.1.9",
  "prometheus-client==0.26.0",
  "authlib==1.6.5",
]

[project.scripts]
rackloom = "rackloom.cli:main"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "ruff==0.17.6",
  "mypy==2.4.1",
  "import-linter==2.17",
  "types-PyYAML",
  "rackloom-launcher",
  "ansible-core==2.21.6",
  "ansible-runner==2.4.3",
]

[tool.uv.sources]
rackloom-launcher = { path = "../launcher", editable = true }

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rackloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "terraform: utilise la vraie CLI Terraform",
  "ansible: utilise Ansible Runner contre un nœud de labo",
  "docker: utilise le moteur de conteneurs du poste",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]
ignore = ["S101", "S603", "S607", "B008", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "BLE001"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

# docs/architecture.md §3. Le chat passe par `changes` pour faire revalider son brouillon : seuls ses
# imports directs sont contraints.
[tool.importlinter]
root_package = "rackloom"

[[tool.importlinter.contracts]]
name = "resolver : fonction pure, sans connecteurs, exécutions ni secrets"
type = "forbidden"
source_modules = ["rackloom.resolver"]
forbidden_modules = ["rackloom.connectors", "rackloom.executions", "rackloom.secrets"]

[[tool.importlinter.contracts]]
name = "chat : ni inventaire, ni résolveur, ni secrets, ni exécutions, ni approbations, ni connecteurs"
type = "forbidden"
source_modules = ["rackloom.chat"]
forbidden_modules = ["rackloom.inventory", "rackloom.resolver", "rackloom.secrets", "rackloom.executions",
                     "rackloom.approvals", "rackloom.connectors"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "atelier : ni inventaire, ni secrets, ni exécution, ni approbation"
type = "forbidden"
source_modules = ["rackloom.studio"]
forbidden_modules = ["rackloom.inventory", "rackloom.secrets", "rackloom.executions", "rackloom.approvals",
                     "rackloom.connectors", "rackloom.worker", "rackloom.resolver"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "registry : publier ne crée aucun job"
type = "forbidden"
source_modules = ["rackloom.registry"]
forbidden_modules = ["rackloom.executions", "rackloom.approvals", "rackloom.worker"]
