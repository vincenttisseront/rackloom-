PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers rackloom-collect rackloom-config
AuthorizedKeysFile /etc/ssh/authorized/%u
HostKey /var/lib/lab-node/ssh_host_ed25519_key
# F15 : TrustedUserCAKeys / AuthorizedPrincipalsFile activés par lab-node-init
# lorsque /lab-keys/ca.pub est présent (voir 20-rackloom-ca.conf).
